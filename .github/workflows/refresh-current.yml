name: Refresh current ESPN snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-current
  cancel-in-progress: false

jobs:
  collect-current:
    if: github.repository == 'Cheloco44/fantasy-family' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Offline collector, probe and workflow tests without credentials
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Collect one read-only current snapshot
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set +x
          ulimit -c 0
          python3 scripts/collect_current.py --network

      - name: Upload only normalized current data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-league-data
          path: artifacts/current-export/current.json
          retention-days: 1
          if-no-files-found: error

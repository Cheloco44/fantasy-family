name: Lookup November 11 daily scores

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup-daily:
    if: github.repository == 'Cheloco44/fantasy-family' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run all offline Python tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Lookup fixed daily aggregates
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set +x
          ulimit -c 0
          python scripts/lookup_daily.py --network
      - name: Upload sanitized daily scores
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nov-11-daily-scores
          path: artifacts/daily-lookup/nov-11.json
          if-no-files-found: error
          retention-days: 1

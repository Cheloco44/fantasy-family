name: ESPN read-only access check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espn-access-check
  cancel-in-progress: false

jobs:
  verify-access:
    if: github.repository == 'Cheloco44/fantasy-family' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Offline probe and workflow tests (no ESPN credentials)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify read-only ESPN settings access
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set +x
          ulimit -c 0
          python3 - <<'PY'
          import os
          import sys
          if not os.environ.get('ESPN_S2') or not os.environ.get('ESPN_SWID'):
              print('Required ESPN repository secrets are missing.', file=sys.stderr)
              raise SystemExit(2)
          PY
          python3 scripts/probe_espn.py --network
